[workspace]
resolver = "2"
members = [
    "crates/rix-core",
    "crates/rix-storage",
    "crates/rix-net",
    "crates/rix-dom",
    "crates/rix-html",
    "crates/rix-css",
    "crates/rix-text",
    "crates/rix-ipc",
    "crates/rix-render",
    "crates/rix-layout",
    "crates/rix-app",
]

[workspace.package]
version = "0.2.0-alpha.1"
edition = "2021"
authors = ["M0odPP <78881564+M0odPP@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/M0odPP/RixBrowser"
rust-version = "1.88"

[workspace.dependencies]
thiserror = "2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
url = { version = "2.5", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1.43", features = ["full"] }
redb = "2.3"
tempfile = "3.17"
bytes = "1.10"
postcard = { version = "1.1", features = ["use-std"] }
libc = "0.2"
psl = "2"
vello = "0.10"
winit = "0.30"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
pollster = "1.0"
smallvec = { version = "1.14", features = ["serde"] }
svgtypes = "0.16"
criterion = "0.5"
bitflags = "2.13"
encoding_rs = "0.8"
memchr = "2.8"
lightningcss = { version = "1.0.0-alpha.72", default-features = false }
rayon = "1.12"
selectors = "0.40"
cssparser = "0.37"
precomputed-hash = "0.1"
wuff = "0.2.10"
taffy = "0.14"

[profile.dev]
debug = 1

# Keep heavy graphics, font, and crypto crates responsive in dev builds for smooth manual testing.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "debuginfo"
