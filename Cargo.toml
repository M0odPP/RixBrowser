[workspace]
resolver = "2"
members = [
    "crates/rix-core",
    "crates/rix-storage",
    "crates/rix-net",
    "crates/rix-dom",
    "crates/rix-html",
    "crates/rix-css",
    "crates/rix-text",
    "crates/rix-ipc",
    "crates/rix-render",
    "crates/rix-layout",
    "crates/rix-js",
    "crates/rix-jit",
    "crates/rix-media",
    "crates/rix-content",
    "crates/rix-chrome",
    "crates/rix-app",
    "xtask",
]

[workspace.package]
version = "0.2.0-alpha.1"
edition = "2021"
authors = ["M0odPP <78881564+M0odPP@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/M0odPP/RixBrowser"
rust-version = "1.88"

[workspace.dependencies]
thiserror = "2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
url = { version = "2.5", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1.43", features = ["full"] }
redb = "2.3"
tempfile = "3.17"
bytes = "1.10"
postcard = { version = "1.1", features = ["use-std"] }
libc = "0.2"
psl = "2"
vello = "0.10"
naga = { version = "29.0.4", features = ["glsl-in", "wgsl-out"] }
winit = "0.30"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
pollster = "1.0"
smallvec = { version = "1.14", features = ["serde"] }
svgtypes = "0.16"
criterion = "0.5"
bitflags = "2.13"
encoding_rs = "0.8"
memchr = "2.8"
lightningcss = { version = "1.0.0-alpha.72", default-features = false }
rayon = "1.12"
selectors = "0.40"
cssparser = "0.37"
precomputed-hash = "0.1"
wuff = "0.2.10"
taffy = "0.14"
arboard = "3.6"
unicode-ident = "1.0"
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"
hkdf = "0.13"
pbkdf2 = { version = "0.13", features = ["hmac"] }
aes = "0.9"
aes-gcm = "0.11"
cbc = { version = "0.2", features = ["alloc", "block-padding"] }
ed25519-dalek = { version = "3.0", features = ["alloc", "pkcs8", "rand_core"] }
p256 = { version = "0.14", features = ["ecdh", "ecdsa", "pkcs8"] }
p384 = { version = "0.14", features = ["ecdh", "ecdsa", "pkcs8"] }
rsa = { version = "0.10", features = ["sha1", "pkcs1v15", "encoding", "getrandom"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
regex = "1.13"
regress = { version = "0.12", features = ["utf16", "prohibit-unsafe"] }
cranelift-codegen = "0.137"
cranelift-frontend = "0.137"
cranelift-native = "0.137"
wasmtime = { version = "50", default-features = false, features = ["cranelift", "runtime", "std"] }
icu = { version = "2.4", features = ["compiled_data", "unstable"] }
fixed_decimal = { version = "0.7", features = ["ryu"] }
writeable = "0.6"
jiff = { version = "1.0", features = ["tzdb-bundle-always"] }
temporal_rs = { version = "0.2.6", features = ["float64_representable_durations"] }
symphonia = { version = "0.6.1", features = ["all", "exp-video-codecs"] }
symphonia-opus = "0.1.3"
opus-decoder = "0.1.1"
rusty_av1d = { version = "1.3.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
rusty_h264 = "0.17.3"
rusty_vp9 = "0.3.0"
vp8-decoder = "0.1.2"
rusty_av1e = { version = "0.8.1", default-features = false }
vp8-encoder = "0.1.2"
cpal = "0.18.2"

[profile.dev]
debug = 1

# Keep heavy graphics, font, and crypto crates responsive in dev builds for smooth manual testing.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "debuginfo"

[profile.conformance]
inherits = "release"
codegen-units = 4
lto = "off"
panic = "unwind"
