[workspace]
resolver = "2"
members = [
    "crates/rix-core",
    "crates/rix-storage",
    "crates/rix-net",
    "crates/rix-dom",
    "crates/rix-html",
    "crates/rix-text",
    "crates/rix-ipc",
    "crates/rix-app",
]

[workspace.package]
version = "0.2.0-alpha.1"
edition = "2021"
authors = ["M0odPP <78881564+M0odPP@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/M0odPP/RixBrowser"
rust-version = "1.88"

[workspace.dependencies]
thiserror = "2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
url = { version = "2.5", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1.43", features = ["full"] }
redb = "2.3"
tempfile = "3.17"
bytes = "1.10"
postcard = { version = "1.1", features = ["use-std"] }
libc = "0.2"
psl = "2"

[profile.dev]
debug = 1

# Keep heavy graphics, font, and crypto crates responsive in dev builds for smooth manual testing.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "debuginfo"
