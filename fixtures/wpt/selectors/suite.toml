html = "<html><body><div class='wrap'><p id='target' class='hit'><span>ok</span></p></div></body></html>"
css = "@layer base, theme; @layer theme { .wrap:has(span) :is(p, div).hit { color: #16a34a; } } @layer base { #target { color: #dc2626; } }"
